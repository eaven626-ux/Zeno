<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta
      name="description"
      content="تطبيق مراسلة فوري مستوحى من تليجرام للمحادثات الخاصة والمجموعات والقنوات السحابية في الوقت الحقيقي."
    />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZENO" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta property="og:title" content="ZENO | المراسلة السحابية الفورية" />
    <meta
      property="og:description"
      content="تطبيق مراسلة فوري مستوحى من تليجرام للمحادثات الخاصة والمجموعات والقنوات السحابية في الوقت الحقيقي."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0e1621] dark:text-slate-100 antialiased selection:bg-sky-500/20">
    <div id="root"></div>
    <script>
      window.addEventListener(
        'error',
        function (e) {
          if (
            e &&
            e.message === 'Script error.' &&
            !e.filename &&
            e.lineno === 0 &&
            e.colno === 0 &&
            !e.error
          ) {
            e.preventDefault();
          }
        },
        true
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
